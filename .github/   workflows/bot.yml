
name: LOTEX SHOP BOT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotex-shop-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub kodini yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni tekshirish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render serverga deploy qilish
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK topilmadi"
            exit 1
          fi
          curl --fail --show-error --silent \
            -X POST "$RENDER_DEPLOY_HOOK"
